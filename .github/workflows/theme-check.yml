name: Theme check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Run theme check
        run: shopify theme check --fail-level error
